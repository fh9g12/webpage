# Site settings
title: Fintan Healy
email: fintan.healy@bristol.ac.uk
description: Academic webpage of Dr. Fintan Healy
baseurl: ""
url: "https://www.fintanhealy.co.uk"


# for google webpage analytics
google_analytics_4: "G-HRQJDT38M5"


# Footer info
affiliation: >
  Fintan Healy<br/>
  Lecturer in Aerospace Engineering<br/>
  University of Bristol

location: >
  University of Bristol<br/>
  Queens Road<br/>
  Bristol, BS8 1TH

contact: >
  <a href="mailto:fintan.healy@bristol.ac.uk" target="_blank"><i class="fa fa-envelope fa-1x"></i> Contact Fintan via email</a> <br/>
  <a href="https://github.com/sbryngelson/academic-website-template"><i class="fa fa-github fa-1x"></i> Use this site as a template!</a>

# Pages shown in navbar
nav_pages:
  - name: about
  - name: publications
  - name: software
  # - name: talks
  # - name: research
  # - name: team
  # - name: teaching
  # - name: blogs


include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

plugins: ["jekyll/scholar"]

# Sass Configuration
sass:
  quiet_deps: true
  style: compressed

scholar:
  last_name: Healy
  first_name: [Fintan]

  style: ieee
  locale: en

  source: /assets/
  bibliography: lib.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
